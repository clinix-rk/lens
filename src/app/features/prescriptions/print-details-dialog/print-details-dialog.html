<h2 mat-dialog-title class="dialog-title">Prescription print details</h2>

<form [formGroup]="form" (ngSubmit)="onGenerate()">
  <mat-dialog-content class="dialog-content">
    <div class="form-grid">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Doctor name</mat-label>
        <input matInput formControlName="doctorName" placeholder="Optional" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Treatment detail</mat-label>
        <input matInput formControlName="treatmentDetail" placeholder="Required for Generate" />
        @if (form.controls.treatmentDetail.touched && form.controls.treatmentDetail.hasError('required')) {
          <mat-error>Treatment detail is required</mat-error>
        }
      </mat-form-field>

      <mat-checkbox formControlName="extendedVersion" class="extended-checkbox">
        With Blood Thinner
      </mat-checkbox>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button type="button" (click)="onProceedWithoutDetails()" class="btn-secondary">
      No, proceed without details
    </button>
    <button mat-raised-button color="primary" type="submit" class="btn-submit">
      Generate
    </button>
  </mat-dialog-actions>
</form>
