<div class="confirmation-dialog-container" [class.danger-theme]="isDanger">
  <div class="dialog-header">
    <div class="header-icon-wrapper">
      <mat-icon class="header-icon">{{ isDanger ? 'warning' : 'help_outline' }}</mat-icon>
    </div>
    <h2 mat-dialog-title class="dialog-title Montserrat-font">{{ title }}</h2>
  </div>

  <div mat-dialog-content class="dialog-content body-medium text-secondary">
    {{ message }}
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-button class="cancel-btn hover-lift" (click)="onCancel()">{{ cancelText }}</button>
    <button mat-flat-button class="confirm-btn hover-lift" (click)="onConfirm()">
      {{ confirmText }}
    </button>
  </div>
</div>
